<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contacts Manager</title>
    <style>
        :root {
            --bg-color: #f4f6f8;
            --container-bg: #fff;
            --text-color: #333;
            --header-bg: #007BFF;
            --header-text: #fff;
            --btn-bg: #007BFF;
            --btn-text: #fff;
            --delete-bg: #dc3545;
            --delete-hover: #a71d2a;
            --message-bg: #e0ffe0;
            --message-border: #28a745;
            --message-text: #155724;
            --delete-all-bg: #ff9800;
            --delete-all-hover: #e65100;
        }

        body.dark-mode {
            --bg-color: #121212;
            --container-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --header-bg: #1a73e8;
            --header-text: #fff;
            --btn-bg: #1a73e8;
            --btn-text: #fff;
            --delete-bg: #e53935;
            --delete-hover: #b71c1c;
            --message-bg: #2e7d32;
            --message-border: #66bb6a;
            --message-text: #fff;
            --delete-all-bg: #f57c00;
            --delete-all-hover: #e65100;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            transition: background 0.3s, color 0.3s;
        }
        .container {
            width: 90%;
            max-width: 800px;
            margin: 40px auto;
            background: var(--container-bg);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
            transition: background 0.3s;
            position: relative;
        }
        h1 {
            text-align: center;
        }
        .top-buttons {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
        }
        .dark-mode-toggle, .delete-all-btn {
            padding: 8px 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
            color: var(--btn-text);
        }
        .dark-mode-toggle {
            background-color: var(--btn-bg);
        }
        .dark-mode-toggle:hover {
            opacity: 0.8;
        }
        .delete-all-btn {
            background-color: var(--delete-all-bg);
        }
        .delete-all-btn:hover {
            background-color: var(--delete-all-hover);
        }
        form {
            margin-bottom: 20px;
        }
        label {
            font-weight: bold;
            display: block;
            margin-top: 10px;
        }
        input[type="text"], input[type="submit"] {
            padding: 10px;
            width: 100%;
            margin-top: 5px;
            border-radius: 5px;
            border: 1px solid #ccc;
            transition: background 0.3s, color 0.3s;
        }
        input[type="submit"] {
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            margin-top: 15px;
            cursor: pointer;
        }
        input[type="submit"]:hover {
            opacity: 0.9;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }
        th {
            background-color: var(--header-bg);
            color: var(--header-text);
        }
        tr:hover {
            background-color: rgba(0,0,0,0.05);
        }
        .message {
            padding: 10px;
            background-color: var(--message-bg);
            border-left: 5px solid var(--message-border);
            margin-bottom: 20px;
            border-radius: 5px;
            color: var(--message-text);
        }
        .delete-btn {
            background-color: var(--delete-bg);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
        }
        .delete-btn:hover {
            background-color: var(--delete-hover);
        }
        @media (max-width: 600px) {
            th, td, input[type="text"], input[type="submit"], .dark-mode-toggle, .delete-all-btn {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-buttons">
            <button class="dark-mode-toggle" id="darkModeBtn">🌙 Dark Mode</button>
            <form method="POST" onsubmit="return confirm('Are you sure you want to delete all contacts?');">
                <input type="hidden" name="action" value="delete_all">
                <input type="submit" class="delete-all-btn" value="Delete All">
            </form>
        </div>

        <h1>Contacts Manager</h1>

        
            <div class="message">Contact added successfully.</div>
        

        <form method="POST" action="/">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="phone">Phone Number:</label>
            <input type="text" id="phone" name="phone" required>

            <input type="submit" value="Add Contact">
        </form>

        
            <table>
                <tr>
                    <th>Name</th>
                    <th>Phone Number</th>
                    <th>Delete</th>
                </tr>
                
                    <tr>
                        <td>Noah Thieken</td>
                        <td>513-801-0813</td>
                        <td>
                            <form method="POST" action="/">
                                <input type="hidden" name="contact_id" value="950">
                                <input type="hidden" name="action" value="delete">
                                <input type="submit" class="delete-btn" value="Delete">
                            </form>
                        </td>
                    </tr>
                
            </table>
        
    </div>

    <script>
        const darkModeBtn = document.getElementById('darkModeBtn');

        // Load dark mode preference
        if (localStorage.getItem('darkMode') === 'enabled') {
            document.body.classList.add('dark-mode');
            darkModeBtn.textContent = '☀️ Light Mode';
        }

        darkModeBtn.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            if (document.body.classList.contains('dark-mode')) {
                localStorage.setItem('darkMode', 'enabled');
                darkModeBtn.textContent = '☀️ Light Mode';
            } else {
                localStorage.setItem('darkMode', 'disabled');
                darkModeBtn.textContent = '🌙 Dark Mode';
            }
        });
    </script>
</body>
</html>
